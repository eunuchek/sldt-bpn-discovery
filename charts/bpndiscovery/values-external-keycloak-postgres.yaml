# Example configuration for BPN Discovery with external Keycloak and PostgreSQL
# This example shows how to configure BPN Discovery to use:
# - External PostgreSQL database (instead of the bundled one)
# - Keycloak for OAuth2 authentication
#
# Usage:
# helm install bpndiscovery charts/bpndiscovery -f charts/bpndiscovery/values-external-keycloak-postgres.yaml

# Disable bundled PostgreSQL since we're using an external database
enablePostgres: false

bpndiscovery:
  # Enable OAuth2 authentication
  authentication: true
  
  # Keycloak/IDP configuration
  idp:
    # URL of your Keycloak realm's issuer
    # Example: https://your-keycloak-server/auth/realms/your-realm
    issuerUri: "https://centralidp.ippcp-dev.epa.si/auth/realms/CX-Central"
    # Client ID for the BPN Discovery service
    publicClientId: "bpndiscovery-client"
    # Claim name in the JWT token that contains the BPN
    bpnIdClaimName: "bpn"
  
  # External PostgreSQL database configuration
  dataSource:
    driverClassName: org.postgresql.Driver
    sqlInitPlatform: pg
    # Connection URL to your external PostgreSQL database
    # Format: jdbc:postgresql://<host>:<port>/<database>
    url: jdbc:postgresql://172.26.4.186:5432/bpndiscovery
    # Database username
    user: bpndiscovery
    # Database password (consider using Kubernetes secrets for production)
    password: your-secure-password
  
  # BPN Discovery endpoint configuration for self-registration on discovery-finder
  bpndiscoveryEndpoint:
    # Allowed types for this BPN Discovery instance (comma-separated)
    allowedTypes: oen,wmi,bpid
    # Description of this BPN Discovery service
    description: "BPN Discovery Service"
    # Public endpoint address where this service is accessible
    # This should be the full URL including protocol and domain
    endpointAddress: "https://your-domain.com/bpndiscovery"
    # URL to the API documentation (Swagger UI)
    documentation: "https://your-domain.com/bpndiscovery/swagger/index.html"
    # Time to live in seconds (31536000 = 1 year)
    timeToLive: "31536000"
  
  # Discovery Finder client configuration
  # Used to register this BPN Discovery service on the Discovery Finder
  discoveryfinderClient:
    # Base URL of the Discovery Finder service
    baseUrl: "https://discovery-finder.example.com"
    registration:
      # OAuth2 client credentials for authenticating with Discovery Finder
      clientId: "bpndiscovery-client"
      clientSecret: "your-client-secret"
      authorizationGrantType: client_credentials
    # Cron expression for periodic re-registration (daily at midnight)
    schedulerCronFrequency: "0 0 0 * * *"
    provider:
      # Token endpoint of your Keycloak realm
      tokenUri: "https://centralidp.ippcp-dev.epa.si/auth/realms/CX-Central/protocol/openid-connect/token"
  
  # Ingress configuration
  ingress:
    enabled: true
    className: nginx
    # Enable TLS/HTTPS
    tls: true
    urlPrefix: /bpndiscovery
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: "/$2"
      nginx.ingress.kubernetes.io/x-forwarded-prefix: "/bpndiscovery"
  
  # Host for ingress routing
  host: your-domain.com
  
  # Resource limits and requests
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1024Mi"
      cpu: "750m"

# PostgreSQL subchart configuration
# Since we're using an external database, disable the bundled PostgreSQL
postgresql:
  enabled: false
